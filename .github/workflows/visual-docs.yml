name: Visual docs

# The canonical, copy-paste setup for the screencomp visual-docs standard. The
# whole pipeline — capture in a pinned container, verify reproducibility,
# classify against the committed image-free manifest, deploy the gallery (the
# blessed "current state" on push; a per-PR preview under pr-<n>/), post a sticky
# before/after comment, and push the regenerated manifest to the PR branch — is
# delegated to screencomp's reusable workflow. The ONLY thing this repo provides
# is its capture command (capture.mjs); the only thing it still hand-rolls is the
# preview cleanup on PR close, which the reusable workflow does not handle.
#
# See README "Local capture" to reproduce the same captures on your machine.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write # push gh-pages; commit the regenerated manifest to the PR branch
  pull-requests: write # post the diff comment

# Serialize so concurrent runs never race to push the gh-pages branch.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  # Capture -> verify -> classify -> gallery -> deploy -> comment -> manifest.
  # Runs on push and on PR open/synchronize/reopen; skipped on PR close.
  visual-docs:
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
    uses: nickderobertis/screencomp/.github/workflows/visual-docs-reusable.yml@v0.1.11
    with:
      platform: linux-x86_64
      container: mcr.microsoft.com/playwright:v1.60.0-noble # MUST match package.json's playwright version
      gallery-title: "Acme — visual docs"
      # Runs inside `container`, once into shots/current/<platform> and again into
      # shots/verify/<platform> for the reproducibility gate. capture.mjs writes
      # $SHOTS_OUT/<project>/<name>.png — exactly the layout screencomp classifies.
      capture-command: |
        npm ci
        node capture.mjs "$SHOTS_OUT" site
    secrets:
      # Optional. Only needed if this repo enforces required status checks: the
      # default GITHUB_TOKEN's manifest push starts no runs and would strand the
      # PR, so set VISUAL_DOCS_PUSH_TOKEN to a credential that can trigger
      # workflows (a fine-grained PAT or App token). Empty => falls back to
      # GITHUB_TOKEN, which is fine when no checks are required.
      push-token: ${{ secrets.VISUAL_DOCS_PUSH_TOKEN }}

  # Remove a PR's preview directory when the PR closes. The reusable workflow has
  # no close handler, so without this the pr-<n>/ previews accrue on gh-pages.
  cleanup:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Remove pr-<n>/ preview
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -d "pr-${PR}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r "pr-${PR}"
            git commit -m "chore: remove visual-diff preview for PR #${PR}"
            git push
          else
            echo "No preview directory for PR #${PR}."
          fi
