# screencomp configuration. Picked up automatically by `screencomp` when run from
# the repo root — in CI (the reusable workflow's `comment` step) and locally (the
# pre-push guard's `scope` check). This is the same file `screencomp init`
# scaffolds; it is committed so the whole pipeline is configured in one place.

[comment]
# Styling for the sticky PR comment the reusable workflow posts.
title = "Visual changes"   # comment heading
marker = "screencomp"      # embedded as <!-- screencomp --> so re-runs upsert one comment
show_unchanged = false     # keep the comment to what actually changed
embed_limit = 10           # inline the diff thumbnails when ≤ N shots differ (0 disables)

[guard]
# Drives the optional local pre-push guard (scripts/pre-push). `screencomp scope`
# matches the files in a push against these globs; a hit means screenshot-relevant
# code changed and the guard runs the local visual check before the push lands.
paths = ["site/**", "capture.mjs", "package.json", "package-lock.json"]
platform = "linux-x86_64"                          # the single platform key (see README)
manifest = "shots/baseline/linux-x86_64.sha256"    # the committed image-free baseline
gallery  = "shots/review"                          # where a local drift review-gallery is written
