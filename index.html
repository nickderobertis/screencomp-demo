<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme — visual docs</title>
<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#222}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}section{margin-bottom:2rem}figure{margin:0}img{width:100%;height:auto;border:1px solid #ddd;border-radius:4px}figcaption{font-size:.85rem;color:#555;margin-top:.25rem}</style>
</head>
<body>
<h1>Acme — visual docs</h1>
<section><h2>desktop</h2><div class="grid">
<figure><img loading="lazy" src="desktop/about.png" alt="desktop/about.png"><figcaption>about</figcaption></figure>
<figure><img loading="lazy" src="desktop/home.png" alt="desktop/home.png"><figcaption>home</figcaption></figure>
<figure><img loading="lazy" src="desktop/pricing.png" alt="desktop/pricing.png"><figcaption>pricing</figcaption></figure>
</div></section>
<section><h2>mobile</h2><div class="grid">
<figure><img loading="lazy" src="mobile/about.png" alt="mobile/about.png"><figcaption>about</figcaption></figure>
<figure><img loading="lazy" src="mobile/home.png" alt="mobile/home.png"><figcaption>home</figcaption></figure>
<figure><img loading="lazy" src="mobile/pricing.png" alt="mobile/pricing.png"><figcaption>pricing</figcaption></figure>
</div></section>
</body>
</html>
